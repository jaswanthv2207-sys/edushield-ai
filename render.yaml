# Render blueprint: one web service (Docker).
# Dashboard -> New -> Blueprint -> point at this repo ->
# Render reads this file and provisions everything.
#
# DATABASE_URL uses SQLite instead of a managed Postgres instance:
# Render free Postgres expires after ~30 days (which crash-looped the
# app when edushield-db expired). SQLite is free forever and the app
# re-seeds demo data automatically whenever the ephemeral disk resets.
services:
  - type: web
    name: edushield-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite:////app/edushield.db"
      - key: DEBUG
        value: "false"
