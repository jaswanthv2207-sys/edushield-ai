# Render blueprint: one web service (Docker) + managed Postgres.
# Dashboard -> New -> Blueprint -> point at this repo ->
# Render reads this file and provisions everything.
services:
  - type: web
    name: edushield-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: edushield-db
          property: connectionString
      - key: DEBUG
        value: "false"

databases:
  - name: edushield-db
    plan: free
    databaseName: edushield
    user: edushield
